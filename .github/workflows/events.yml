name: Refresh Dubai events feed

on:
  schedule:
    - cron: '17 2 * * *'   # daily ~06:17 Dubai time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - run: python scripts/scrape_events.py

      - name: Commit events.json if changed
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events/events.json
          git diff --cached --quiet || git commit -m "events: daily refresh"
          git push
